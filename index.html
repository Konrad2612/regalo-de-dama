<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Max Verstappen & Flores Amarillas | Día de la Amistad (MJ - Chicago)</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Top Red Bull Speed Bar -->
  <div class="top-speed-strip"></div>

  <!-- F1 Racetrack & Cars Canvas Background (Green Landscape) -->
  <canvas id="trackCanvas"></canvas>

  <!-- Main Viewport Layout -->
  <main class="app-viewport">

    <!-- Right Side (Desktop) / Centered (Mobile): Max Verstappen + Speech Bubble -->
    <div class="verstappen-container">

      <!-- Speech Bubble Greeting Box -->
      <div class="speech-bubble" id="speechBubble">
        <div class="bubble-tag">🏎️ RED BULL RACING • #1 MAX VERSTAPPEN 🏆</div>
        <h1 class="bubble-title">¡Feliz Día de la Amistad! 💛</h1>
        <p class="bubble-text">
         Espero te guste dama tarde un poco pero queria hacer algo con las cosas que te gustan y todo mi cariño. 
          ¡te quiero mucho damita! 🌼✨
        </p>
      </div>

      <!-- Max Verstappen Holding Yellow Flowers -->
      <div class="max-character-wrapper" id="maxVerstappenChar" title="Haz clic en Max Verstappen 🏎️">
        <svg class="max-character-svg" viewBox="0 0 280 340">
          <defs>
            <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#002b66" />
              <stop offset="100%" stop-color="#0a192f" />
            </linearGradient>
            <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffea00" />
              <stop offset="100%" stop-color="#d97706" />
            </linearGradient>
            <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
            </filter>
          </defs>

          <!-- Ground Shadow -->
          <ellipse cx="140" cy="325" rx="85" ry="12" fill="rgba(0,0,0,0.55)" filter="blur(3px)" />

          <!-- Max Body / Red Bull Suit -->
          <g id="suitGroup">
            <path d="M 80 145 C 65 160, 55 180, 55 315 L 225 315 C 225 180, 215 160, 200 145 Z" fill="url(#suitGrad)" stroke="#090e1a" stroke-width="2.5" />
            <path d="M 115 130 L 140 160 L 165 130 Z" fill="#ff003c" stroke="#002b66" stroke-width="1.5" />
            <path d="M 75 145 C 65 170, 60 210, 65 240" stroke="#ff003c" stroke-width="12" fill="none" stroke-linecap="round" />
            <path d="M 205 145 C 215 170, 220 210, 215 240" stroke="#ff003c" stroke-width="12" fill="none" stroke-linecap="round" />
            <path d="M 80 145 L 90 250" stroke="#ffd700" stroke-width="4" fill="none" />
            <path d="M 200 145 L 190 250" stroke="#ffd700" stroke-width="4" fill="none" />

            <!-- Red Bull Chest Logo -->
            <g transform="translate(140, 205)">
              <circle cx="0" cy="0" r="14" fill="#ff003c" />
              <path d="M -12 -2 Q -6 -10 0 0 Q -6 6 -12 2 Z" fill="#ffd700" />
              <path d="M 12 -2 Q 6 -10 0 0 Q 6 6 12 2 Z" fill="#ffd700" />
              <text x="0" y="18" fill="#ffffff" font-family="Orbitron, sans-serif" font-size="8" font-weight="900" text-anchor="middle">Red Bull</text>
              <text x="0" y="26" fill="#ffd700" font-family="Orbitron, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">RACING</text>
            </g>

            <!-- Sponsors Patches -->
            <rect x="85" y="180" width="42" height="13" rx="3" fill="#060a17" stroke="#ffd700" stroke-width="0.8" />
            <text x="106" y="189" fill="#ffffff" font-family="Orbitron, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">ORACLE</text>
            <rect x="153" y="180" width="42" height="13" rx="3" fill="#060a17" stroke="#ff003c" stroke-width="0.8" />
            <text x="174" y="189" fill="#ffffff" font-family="Orbitron, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">HONDA</text>
            <rect x="86" y="245" width="34" height="10" rx="2" fill="#090e1a" />
            <text x="103" y="252" fill="#ffd700" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">TAG HEUER</text>
            <rect x="160" y="245" width="34" height="10" rx="2" fill="#090e1a" />
            <text x="177" y="252" fill="#ffffff" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">MOBIL 1</text>
            <circle cx="140" cy="173" r="9" fill="#ffd700" stroke="#000" stroke-width="1" />
            <text x="140" y="177" fill="#000000" font-family="Orbitron, sans-serif" font-size="10" font-weight="900" text-anchor="middle">1</text>
          </g>

          <!-- Arms -->
          <path d="M 75 160 C 50 180, 45 220, 65 245" stroke="#002b66" stroke-width="18" stroke-linecap="round" fill="none" />
          <circle cx="65" cy="245" r="10" fill="#0f172a" />
          <path d="M 205 160 C 235 180, 215 230, 165 225" stroke="#002b66" stroke-width="18" stroke-linecap="round" fill="none" />
          <circle cx="165" cy="225" r="10" fill="#0f172a" />

          <!-- Neck -->
          <rect x="125" y="115" width="30" height="28" fill="#ffdbac" stroke="#e5b887" stroke-width="0.8" />

          <!-- Head -->
          <g id="headGroup">
            <path d="M 110 85 C 110 60, 170 60, 170 85 C 170 118, 155 135, 140 135 C 125 135, 110 118, 110 85 Z" fill="#ffdbac" stroke="#e5b887" stroke-width="1" />
            <ellipse cx="108" cy="95" rx="4" ry="7" fill="#ffdbac" />
            <ellipse cx="172" cy="95" rx="4" ry="7" fill="#ffdbac" />
            <path d="M 108 90 C 105 70, 120 50, 140 50 C 160 50, 175 70, 172 90 C 168 70, 150 57, 140 57 C 130 57, 112 70, 108 90 Z" fill="#ca8a04" />
            <path d="M 112 80 Q 140 55 168 80 Q 155 65 140 65 Q 125 65 112 80 Z" fill="#eab308" />
            <path d="M 102 86 C 100 56, 180 56, 178 86 Z" fill="#001e4d" />
            <path d="M 94 86 Q 140 74 186 86 L 180 91 Q 140 80 100 91 Z" fill="#090e1a" />
            <rect x="125" y="64" width="30" height="14" rx="2" fill="#ff003c" />
            <text x="140" y="75" fill="#ffffff" font-family="Orbitron, sans-serif" font-size="10" font-weight="900" text-anchor="middle">1</text>
            <path d="M 120 90 Q 126 87 132 91" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <path d="M 148 91 Q 154 87 160 90" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <ellipse cx="126" cy="97" rx="3.5" ry="4" fill="#0284c7" />
            <ellipse cx="154" cy="97" rx="3.5" ry="4" fill="#0284c7" />
            <circle cx="127" cy="96" r="1" fill="#ffffff" />
            <circle cx="155" cy="96" r="1" fill="#ffffff" />
            <path d="M 140 95 L 138 107 L 143 108" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
            <path d="M 128 117 Q 140 127 152 117" stroke="#7f1d1d" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M 131 118 Q 140 123 149 118" stroke="#ffffff" stroke-width="2" fill="none" />
          </g>

          <!-- Bouquet -->
          <g transform="translate(155, 185)" filter="url(#dropGlow)">
            <path d="M 15 45 L 20 15" stroke="#15803d" stroke-width="4" />
            <path d="M 15 45 L 5 10" stroke="#15803d" stroke-width="4" />
            <path d="M 15 45 L 35 18" stroke="#15803d" stroke-width="4" />
            <path d="M 5 40 Q 15 35 25 40 Q 15 50 5 40 Z" fill="#ffd700" stroke="#b45309" stroke-width="1" />
            <circle cx="15" cy="41" r="4" fill="#ff003c" />

            <g transform="translate(5, 5)">
              <g fill="url(#yellowGrad)" stroke="#b45309" stroke-width="0.5">
                <ellipse cx="0" cy="0" rx="5" ry="16" />
                <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(30)" />
                <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(60)" />
                <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(90)" />
                <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(120)" />
                <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(150)" />
              </g>
              <circle cx="0" cy="0" r="9" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
            </g>

            <g transform="translate(26, 12)">
              <g fill="#ffd700">
                <ellipse cx="0" cy="0" rx="4" ry="13" />
                <ellipse cx="0" cy="0" rx="4" ry="13" transform="rotate(45)" />
                <ellipse cx="0" cy="0" rx="4" ry="13" transform="rotate(90)" />
                <ellipse cx="0" cy="0" rx="4" ry="13" transform="rotate(135)" />
              </g>
              <circle cx="0" cy="0" r="7" fill="#451a03" />
            </g>

            <g transform="translate(-12, 18)">
              <g fill="#ffea00">
                <ellipse cx="0" cy="0" rx="3.5" ry="11" />
                <ellipse cx="0" cy="0" rx="3.5" ry="11" transform="rotate(40)" />
                <ellipse cx="0" cy="0" rx="3.5" ry="11" transform="rotate(80)" />
                <ellipse cx="0" cy="0" rx="3.5" ry="11" transform="rotate(120)" />
                <ellipse cx="0" cy="0" rx="3.5" ry="11" transform="rotate(160)" />
              </g>
              <circle cx="0" cy="0" r="6" fill="#78350f" />
            </g>

            <polygon points="0,-22 4,-14 12,-14 5,-9 8,-1 -2,-7 -8,-1 -5,-9 -12,-14 -4,-14" fill="#ffffff" />
            <polygon points="32,-6 35,-1 40,-1 36,2 38,7 33,3 28,7 30,2 26,-1 31,-1" fill="#ffffff" />
          </g>
        </svg>
      </div>

    </div>

  </main>

  <!-- Sticky Bottom Audio Player Bar -->
  <div class="music-player-bar">
    <div class="player-inner">

      <!-- Track Info -->
      <div class="track-info">
        <div class="disc-art" id="discArt">🕺</div>
        <div class="track-details">
          <div class="track-title" id="trackTitle">Chicago</div>
          <div class="track-subtitle" id="trackArtist">Michael Jackson</div>
        </div>
      </div>

      <!-- F1 Telemetry Visualizer Canvas -->
      <div class="visualizer-container">
        <canvas id="visualizerCanvas" width="260" height="32"></canvas>
      </div>

      <!-- Player Controls (Limpio: Solo Botón de Reproducción) -->
      <div class="player-controls">
        <button id="playPauseBtn" class="ctrl-btn play-btn" title="Reproducir / Pausa">▶</button>
      </div>

    </div>
  </div>

  <!-- Application Scripts -->
  <script src="js/trackEngine.js"></script>
  <script src="js/musicPlayer.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
